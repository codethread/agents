[tools]
node = "24.21.0"
bun = "1.4.2"

# Repository bootstrap must not install unrelated global tools.
[settings]
enable_tools = ["bun", "node"]

[tasks.bootstrap]
alias = "default"
description = "Install workspace dependencies, hooks, and generated skills"
run = '''
bun install --frozen-lockfile
bun run --no-install skillbox sync
'''

[tasks.lake-start]
description = "Start this lake in an already running Botlake supervisor"
run = 'botlake lake start --workspace "{{ config_root }}"'
